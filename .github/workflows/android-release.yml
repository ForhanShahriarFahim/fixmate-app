name: Android release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate, sign, and package Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    permissions:
      contents: read
    outputs:
      artifact_stem: ${{ steps.version.outputs.artifact_stem }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag against pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(awk '$1 == "version:" { print $2 }' pubspec.yaml)"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then
            echo "pubspec.yaml must use MAJOR.MINOR.PATCH+BUILD." >&2
            exit 1
          fi
          expected_tag="v${app_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $expected_tag." >&2
            exit 1
          fi
          version_name="${app_version%%+*}"
          version_code="${app_version##*+}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "artifact_stem=fixmate-${version_name}-build.${version_code}" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in origin/main." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Install Firebase test tooling
        run: npm ci
        working-directory: functions

      - name: Run Firebase tooling tests
        run: npm test
        working-directory: functions

      - name: Run Firestore Rules emulator tests
        run: npm run test:rules
        working-directory: functions

      - name: Configure private Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required Android signing secret $variable is not configured." >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/fixmate-release-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Prepare versioned release files
        shell: bash
        env:
          ARTIFACT_STEM: ${{ steps.version.outputs.artifact_stem }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${ARTIFACT_STEM}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk dist/fixmate-android.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload signed Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_stem }}-signed
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/fixmate-release-keystore.jks"

  publish:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download signed Android build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_stem }}-signed
          path: dist

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_STEM: ${{ needs.build.outputs.artifact_stem }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          set -euo pipefail
          versioned_apk="dist/${ARTIFACT_STEM}-android.apk"
          assets=(
            "dist/fixmate-android.apk#FixMate Android APK (latest)"
            "${versioned_apk}#FixMate ${VERSION_NAME} build ${VERSION_CODE} APK"
            "dist/SHA256SUMS.txt#SHA-256 checksums"
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "FixMate ${VERSION_NAME} (${VERSION_CODE})" \
              --generate-notes
          fi
