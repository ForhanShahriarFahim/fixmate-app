name: fixmate
description: A trusted home-service booking marketplace for Bangladesh.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: 6.7.1
  cloud_functions: 6.3.5
  firebase_app_check: 0.4.5+2
  firebase_auth: 6.5.6
  firebase_core: 4.12.1
  firebase_crashlytics: 5.2.6
  firebase_messaging: 16.4.3
  firebase_storage: 13.4.5
  flutter_riverpod: 3.3.2
  go_router: 17.3.0
  image_picker: 1.2.3
  intl: 0.20.3
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/bangladesh_locations.json
